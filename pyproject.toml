[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "czn-automation"
version = "0.1.0"
description = "卡厄思梦境 PC 自动化项目骨架"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Michael" }
]
dependencies = [
  "Pillow>=10.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
